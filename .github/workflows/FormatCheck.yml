name: FormatCheck

on:
  push:
    branches:
      - 'main'
      - 'release-'
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add(PackageSpec(; name="JuliaFormatter", version="2"))'
      - name: Check formatting
        run: |
          julia -e '
            using JuliaFormatter
            if !format("."; overwrite=false)
                @error "Some files are not formatted; run `format(\".\")` locally and commit the result."
                exit(1)
            end'
